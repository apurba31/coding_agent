[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mini-code-agent"
version = "0.1.0"
description = "Educational AI Coding Assistant built completely from scratch"
readme = "README.md"
requires-python = ">=3.12"

authors = [
    { name = "Your Name" }
]

license = { text = "MIT" }

keywords = [
    "rag",
    "code-agent",
    "embeddings",
    "vector-db",
    "tree-sitter",
    "semantic-search",
    "groq",
    "lancedb"
]

dependencies = [

    ############################################################
    # LLM
    ############################################################

    "groq~=0.31.0",

    ############################################################
    # Embeddings
    ############################################################

    "sentence-transformers~=5.1.0",
    "transformers~=4.56.0",
    "torch>=2.8,<3.0",
    "accelerate~=1.10.0",

    ############################################################
    # Vector Database
    ############################################################

    "lancedb~=0.25.0",
    "pyarrow~=21.0.0",

    ############################################################
    # Parsing
    ############################################################

    "tree-sitter~=0.25.1",
    "tree-sitter-language-pack~=0.9.0",

    ############################################################
    # Keyword Search
    ############################################################

    "rank-bm25~=0.2.2",

    ############################################################
    # Models / Config
    ############################################################

    "pydantic~=2.11.7",
    "pydantic-settings~=2.10.1",

    ############################################################
    # CLI
    ############################################################

    "typer~=0.17.4",
    "rich~=14.1.0",

    ############################################################
    # Git
    ############################################################

    "GitPython~=3.1.45",

    ############################################################
    # Configuration
    ############################################################

    "python-dotenv~=1.1.1",

    ############################################################
    # HTTP
    ############################################################

    "httpx~=0.28.1",

    ############################################################
    # Serialization
    ############################################################

    "orjson~=3.11.2",

    ############################################################
    # Logging
    ############################################################

    "loguru~=0.7.3",

    ############################################################
    # Utilities
    ############################################################

    "watchfiles~=1.1.0",
    "tqdm~=4.67.1",
    "platformdirs~=4.4.0",
    "typing-extensions~=4.15.0",
    "ruff~=0.12.9",

    ############################################################
    # Token Counting
    ############################################################

    "tiktoken~=0.11.0"
]

############################################################
# Optional Dependencies
############################################################

[project.optional-dependencies]

dev = [

    "pytest~=8.4.1",
    "pytest-cov~=6.2.1",

    "black~=25.1.0",
    "ruff~=0.12.9",
    "isort~=6.0.1",

    "mypy~=1.17.1",

    "ipython~=9.4.0",

    "pre-commit~=4.3.0"
]

docs = [

    "mkdocs~=1.6.1",
    "mkdocs-material~=9.6.16"
]

############################################################
# CLI
############################################################

[project.scripts]

mini-agent = "src.app:main"

############################################################
# Black
############################################################

[tool.black]

line-length = 100
target-version = ["py312"]

############################################################
# Ruff
############################################################

[tool.ruff]

line-length = 100
target-version = "py312"

[tool.ruff.lint]

select = [
    "E",
    "F",
    "I",
    "UP",
    "B"
]

############################################################
# isort
############################################################

[tool.isort]

profile = "black"

############################################################
# pytest
############################################################

[tool.pytest.ini_options]

pythonpath = ["."]
testpaths = ["tests"]

############################################################
# Coverage
############################################################

[tool.coverage.run]

branch = true
source = ["src"]

############################################################
# MyPy
############################################################

[tool.mypy]

python_version = "3.12"
strict = true
ignore_missing_imports = true

############################################################
# Hatch
############################################################

[tool.hatch.build.targets.wheel]

packages = ["src"]